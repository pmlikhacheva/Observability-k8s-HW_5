apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app-rules
  labels:
    release: monitoring
spec:
  groups:
    - name: app.rules
      rules:

        - alert: HighErrorRate
          expr: rate(app_errors_total[5m]) / rate(app_requests_total[5m]) > 0.2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: High error rate detected

        - alert: AppDown
          expr: up{job="my-app"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Application is down
